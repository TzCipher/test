<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sandpile Item Checker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
    }
    input, button {
      padding: 10px;
      margin: 10px;
      border-radius: 5px;
      border: none;
    }
    #result {
      margin-top: 20px;
      font-size: 18px;
      padding: 15px;
      border-radius: 8px;
      display: none;
    }
    .success {
      background-color: #2e7d32;
      color: white;
    }
    .fail {
      background-color: #c62828;
      color: white;
    }
    a.download {
      display: inline-block;
      margin-top: 10px;
      background-color: #ffffff;
      color: #000;
      padding: 10px;
      border-radius: 6px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>Sandpile Item Checker</h1>
  <p>Enter your Sandpile user ID below to check if you own a specific item:</p>
  <input type="text" id="userId" placeholder="e.g., 812" />
  <button onclick="checkItem()">Check Item</button>

  <div id="result"></div>

  <script>
    async function checkItem() {
      const userId = document.getElementById('userId').value.trim();
      const itemId = '1579'; // Change this to whatever item ID you want to check
      const resultBox = document.getElementById('result');
      resultBox.innerHTML = '';
      resultBox.style.display = 'none';

      if (!userId) {
        alert('Please enter a user ID.');
        return;
      }

      try {
        const response = await fetch(`https://sandpile.xyz/user/${userId}`);
        const htmlText = await response.text();

        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlText, 'text/html');

        const itemLinks = Array.from(doc.querySelectorAll('a')).map(a => a.href);
        const ownsItem = itemLinks.includes(`https://sandpile.xyz/item/${itemId}`);

        resultBox.style.display = 'block';

        if (ownsItem) {
          resultBox.className = 'success';
          resultBox.innerHTML = `
            ✅ You own the item!<br>
            <a class="download" href="https://cdn.sandpile.xyz/item-thumbnails/${itemId}.png" download>Download PNG</a>
          `;
        } else {
          resultBox.className = 'fail';
          resultBox.innerHTML = '❌ You do not own the item.';
        }

      } catch (error) {
        resultBox.className = 'fail';
        resultBox.style.display = 'block';
        resultBox.innerHTML = '⚠️ Error fetching user data. Please check the user ID.';
        console.error(error);
      }
    }
  </script>
</body>
</html>
